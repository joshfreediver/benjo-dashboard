<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benjo Dual Dashboard</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(135deg, #00308F, #001f3f, #007aff);
      overflow: hidden; /* Prevents the main page from scrolling */
    }

    .container {
      display: flex;
      height: 100vh;
      width: 100vw;
      gap: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    iframe {
      flex: 1;
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      background: transparent;
      
      /* Hides scrollbars in Firefox and Edge */
      scrollbar-width: none; 
      -ms-overflow-style: none; 
    }

    /* Hides scrollbars in Chrome, Safari, and Opera */
    iframe::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <iframe src="/benjo-dashboard/v19.html"></iframe>
    <iframe src="/benjo-dashboard/v18.html"></iframe>
  </div>
</body>
</html>
