<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benjo's Slim Monitor v18.2</title>

<style>
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

html, body {
    height: 100%; margin: 0; padding: 0;
    background: linear-gradient(135deg, #00308F, #001f3f, #007aff);
    overflow-x: hidden;
}

.dashboard-container {
    padding: 10px; min-height: 100vh; width: 100vw;
    display: flex; flex-direction: column; align-items: center;
}

.dashboard {
    display: flex; flex-direction: column;
    width: 100%; max-width: 360px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(50px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    color: white;
    padding-bottom: 20px;
}

.macos-header { display: flex; gap: 8px; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }

.stoplight { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
.sl-red { background: #ff5f56; }
.sl-yellow { background: #ffbd2e; }
.sl-green { background: #27c93f; }

.top-section {
    display: flex; flex-direction: column; align-items: center;
    padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
}

.ph-time { font-size: 5vh; font-weight: 800; }
.ph-date { font-size: 1.8vh; color: rgba(255,255,255,0.6); margin-bottom: 15px; }

.ticket-tracker-area {
    background: rgba(0,0,0,0.2);
    border-radius: 18px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.1);
}

.tt-header { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.tt-input-group { display: flex; gap: 8px; }

.tt-input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    border-radius: 8px;
    padding: 8px;
}

.tt-add-btn {
    background: #34c759;
    border: none;
    color: white;
    border-radius: 8px;
    padding: 0 12px;
    cursor: pointer;
}

.tt-list { max-height: 180px; overflow-y: auto; padding: 10px; }

.tt-item {
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.main-content { padding: 15px; }

.card {
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 15px;
    text-align: center;
}

.countdown { font-size: 28px; }
</style>
</head>

<body>

<div class="dashboard-container">
<div class="dashboard">

<header class="macos-header">
    <div class="stoplight sl-red" onclick="shiftReset()"></div>
    <div class="stoplight sl-yellow" onclick="clearSnoozed()"></div>
    <div class="stoplight sl-green" onclick="copyAttendance()"></div>
</header>

<section class="top-section">
    <div class="ph-time" id="clock">00:00:00</div>
    <div class="ph-date" id="date"></div>

    <div class="ticket-tracker-area">
        <div class="tt-header">
            <div>Snoozed Ticket Tracker</div>
            <div class="tt-input-group">
                <input type="text" id="tt-input" class="tt-input" placeholder="Ticket #" onkeydown="if(event.key==='Enter') addLiveTicket()">
                <button class="tt-add-btn" onclick="addLiveTicket()">ADD</button>
            </div>
        </div>
        <div class="tt-list" id="tt-list"></div>
    </div>
</section>

<main class="main-content">
    <div class="card">
        <div class="countdown" id="count">--:--:--</div>
    </div>
</main>

</div>
</div>

<script>
let ticketIntervals = {};

function shiftReset() {
    localStorage.removeItem('snoozedTickets');
    location.reload();
}

function clearSnoozed() {
    if (confirm("Clear all snoozed tickets?")) {
        document.getElementById('tt-list').innerHTML = "";
        localStorage.removeItem('snoozedTickets');
    }
}

function copyAttendance() {
    navigator.clipboard.writeText("Attendance copied!");
}

function addLiveTicket() {
    const input = document.getElementById('tt-input');
    const num = input.value.trim();
    if(!num) return;

    const expiry = Date.now() + (2 * 60 * 60 * 1000);
    createTicketItem(num, expiry, true);
    input.value = '';
}

function createTicketItem(num, expiry) {
    const list = document.getElementById('tt-list');
    const item = document.createElement('div');
    item.className = 'tt-item';
    item.innerHTML = `<span>#${num}</span><span class="timer">--:--:--</span>`;
    list.prepend(item);

    const timerText = item.querySelector('.timer');

    ticketIntervals[num] = setInterval(() => {
        const diff = expiry - Date.now();
        if (diff <= 0) {
            timerText.innerText = "DONE";
        } else {
            const m = Math.floor(diff / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            timerText.innerText = `${m}:${s.toString().padStart(2,'0')}`;
        }
    }, 1000);
}

setInterval(() => {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString();
    document.getElementById('date').innerText = now.toDateString();
}, 1000);
</script>

</body>
</html>
